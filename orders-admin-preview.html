<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ORKA | Demo Orders Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f8fb;color:#10294a;font:15px Arial}header{background:#10294a;color:white;padding:22px 6%;font-weight:bold}main{max-width:980px;margin:30px auto;padding:0 18px}.warning{background:#f5e5eb;border-left:5px solid #8b2344;padding:14px;line-height:1.6}a{color:#8b2344}section{background:white;border:1px solid #e1e5ee;border-radius:12px;padding:18px;margin:18px 0}h1{font-size:26px}h2{font-size:18px}button{background:#10294a;color:white;border:0;padding:10px 14px;border-radius:7px;cursor:pointer}select{padding:9px;border:1px solid #bbc5d0;border-radius:6px}small{color:#65748b}.line{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.muted{color:#65748b}</style></head><body><header>ORKA HOMEWEAR / DEMO ADMIN</header><main><a href="./isolated-preview.html">← Back to demo store</a><h1>Orders dashboard — local preview</h1><div class="warning"><strong>TEST DATA ONLY.</strong> This is not the real ORKA admin dashboard. Orders are simulated and stored only in this browser. No Firebase connection, login, customer contact details, payments, or real fulfillment.</div><div class="line"><p id="count">0 demo orders</p><button id="clear" type="button">Clear demo orders</button></div><div id="orders" aria-live="polite"></div></main><script>
const key='orka-signature-isolated-v2-demo-orders';const states=['pending','confirmed','preparing','shipped','delivered','cancelled'];function load(){try{const a=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(a)?a.filter(x=>x&&typeof x.id==='string'&&Array.isArray(x.items)):[]}catch{return []}}let orders=load();function save(){localStorage.setItem(key,JSON.stringify(orders));render()}function render(){const root=document.getElementById('orders');root.replaceChildren();document.getElementById('count').textContent=orders.length+' demo order(s)';if(!orders.length){const p=document.createElement('p');p.className='muted';p.textContent='No demo orders yet. Use the checkout preview to create a simulated order.';root.append(p)}for(const order of orders){const card=document.createElement('section');const title=document.createElement('h2');title.textContent='Demo order '+order.id;card.append(title);const time=document.createElement('small');time.textContent=order.createdAt||'';card.append(time);for(const item of order.items){const p=document.createElement('p');p.textContent='Winter Look '+String(item.id).padStart(2,'0')+' · '+item.size+' · Qty '+item.qty;card.append(p)}const label=document.createElement('label');label.textContent='Demo status: ';const select=document.createElement('select');for(const state of states){const opt=document.createElement('option');opt.value=state;opt.textContent=state;select.append(opt)}select.value=states.includes(order.status)?order.status:'pending';select.addEventListener('change',()=>{order.status=select.value;save()});label.append(select);card.append(label);root.append(card)}}document.getElementById('clear').addEventListener('click',()=>{if(confirm('Delete all local demo orders in this browser?')){orders=[];save()}});render();</script></body></html>
