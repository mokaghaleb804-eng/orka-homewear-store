<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ORKA | Demo Orders Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f8fb;color:#10294a;font:15px Arial}header{background:#10294a;color:white;padding:22px 6%;font-weight:bold}main{max-width:980px;margin:30px auto;padding:0 18px}.warning{background:#f5e5eb;border-left:5px solid #8b2344;padding:14px;line-height:1.6}a{color:#8b2344}section{background:white;border:1px solid #e1e5ee;border-radius:12px;padding:18px;margin:18px 0}h1{font-size:26px}h2{font-size:18px}button{background:#10294a;color:white;border:0;padding:10px 14px;border-radius:7px;cursor:pointer}select{padding:9px;border:1px solid #bbc5d0;border-radius:6px}small{color:#65748b}.line{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.muted{color:#65748b}.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}.stat{background:white;border:1px solid #e1e5ee;border-radius:10px;padding:14px}.stat strong{display:block;font-size:24px;margin-top:6px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.tools input,.tools select{padding:12px;border:1px solid #bbc5d0;border-radius:8px;font:inherit;min-width:0}.tools input{flex:2 1 180px}.tools select{flex:1 1 130px}.history{padding-left:20px;color:#65748b;font-size:13px;line-height:1.8}@media(max-width:480px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><header>ORKA HOMEWEAR / DEMO ADMIN</header><main><a href="./isolated-preview.html">← Back to demo store</a><h1>Orders dashboard — local preview</h1><div class="warning"><strong>TEST DATA ONLY.</strong> This is not the real ORKA admin dashboard. Orders are simulated and stored only in this browser. No Firebase connection, login, customer contact details, payments, or real fulfillment.</div><div class="summary" id="summary" aria-label="Demo order statistics"></div><div class="tools"><input id="order-search" aria-label="Search demo order ID" placeholder="Search order ID…"><select id="status-filter" aria-label="Filter demo order status"><option value="all">All statuses</option><option value="pending">Pending</option><option value="confirmed">Confirmed</option><option value="preparing">Preparing</option><option value="shipped">Shipped</option><option value="delivered">Delivered</option><option value="cancelled">Cancelled</option></select></div><div class="line"><p id="count">0 demo orders</p><button id="clear" type="button">Clear demo orders</button></div><div id="orders" aria-live="polite"></div></main><script>
const key='orka-signature-isolated-v2-demo-orders';const states=['pending','confirmed','preparing','shipped','delivered','cancelled'];const allowed={pending:['confirmed','cancelled'],confirmed:['preparing','cancelled'],preparing:['shipped','cancelled'],shipped:['delivered'],delivered:[],cancelled:[]};function load(){try{const a=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(a)?a.filter(x=>x&&typeof x.id==='string'&&Array.isArray(x.items)):[]}catch{return []}}let orders=load();let searchTerm='',statusFilter='all';document.getElementById('order-search').addEventListener('input',e=>{searchTerm=e.target.value.trim().toLowerCase();render()});document.getElementById('status-filter').addEventListener('change',e=>{statusFilter=e.target.value;render()});function save(){localStorage.setItem(key,JSON.stringify(orders));render()}function render(){const root=document.getElementById('orders');root.replaceChildren();document.getElementById('count').textContent=orders.length+' demo order(s)';const summary=document.getElementById('summary');summary.replaceChildren();for(const [label,count] of [['Total',orders.length],['Pending',orders.filter(o=>o.status==='pending').length],['In progress',orders.filter(o=>['confirmed','preparing','shipped'].includes(o.status)).length],['Delivered',orders.filter(o=>o.status==='delivered').length],['Cancelled',orders.filter(o=>o.status==='cancelled').length]]){const tile=document.createElement('div');tile.className='stat';const name=document.createElement('span');name.textContent=label;const number=document.createElement('strong');number.textContent=String(count);tile.append(name,number);summary.append(tile)}if(!orders.length){const p=document.createElement('p');p.className='muted';p.textContent='No demo orders yet. Use the checkout preview to create a simulated order.';root.append(p)}const visible=orders.filter(o=>(statusFilter==='all'||o.status===statusFilter)&&String(o.id).toLowerCase().includes(searchTerm));if(!visible.length&&orders.length){const empty=document.createElement('p');empty.className='muted';empty.textContent='No demo orders match your filters.';root.append(empty)}for(const order of visible){const card=document.createElement('section');const title=document.createElement('h2');title.textContent='Demo order '+order.id;card.append(title);const time=document.createElement('small');time.textContent=order.createdAt||'';card.append(time);for(const item of order.items){const p=document.createElement('p');p.textContent='Winter Look '+String(item.id).padStart(2,'0')+' · '+item.size+' · Qty '+item.qty;card.append(p)}const label=document.createElement('label');label.textContent='Demo status: ';const select=document.createElement('select');for(const state of [order.status,...(allowed[order.status]||[])]){const opt=document.createElement('option');opt.value=state;opt.textContent=state;select.append(opt)}select.value=states.includes(order.status)?order.status:'pending';select.addEventListener('change',()=>{if(!(allowed[order.status]||[]).includes(select.value)){render();return}order.status=select.value;if(!Array.isArray(order.history))order.history=[];order.history.push({status:order.status,at:new Date().toLocaleString()});save()});label.append(select);card.append(label);if(!(allowed[order.status]||[]).length){const note=document.createElement('p');note.className='muted';note.textContent='Final demo status — no further transitions.';card.append(note)}if(!Array.isArray(order.history)||!order.history.length){const legacy=document.createElement('p');legacy.className='muted';legacy.textContent='Legacy demo order: earlier status changes were not recorded. History starts with the next change.';card.append(legacy)}else if(order.history[0].status!=='pending'){const legacy=document.createElement('p');legacy.className='muted';legacy.textContent='Partial history: this order was created before initial pending events were recorded.';card.append(legacy)}if(Array.isArray(order.history)&&order.history.length){const heading=document.createElement('p');heading.textContent='Demo status history';card.append(heading);const list=document.createElement('ol');list.className='history';for(const event of order.history){const item=document.createElement('li');item.textContent=String(event.status)+' · '+String(event.at||'');list.append(item)}card.append(list)}root.append(card)}}document.getElementById('clear').addEventListener('click',()=>{if(confirm('Delete all local demo orders in this browser?')){orders=[];save()}});render();</script></body></html>
