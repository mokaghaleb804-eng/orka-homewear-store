name: ORKA checkout security static gates
on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'index.html'
      - 'checkout-preview.html'
      - 'scripts/checkout-security-static.cjs'
      - '.github/workflows/checkout-security-static.yml'
  workflow_dispatch:
jobs:
  security-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify fail-closed checkout
        run: node scripts/checkout-security-static.cjs
