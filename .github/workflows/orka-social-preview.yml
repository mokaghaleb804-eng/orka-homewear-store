name: Build ORKA social preview image
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/orka-social-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate padded preview using original approved logo
        run: |
          python -m pip install Pillow==11.3.0
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import re
          src = Image.open('orka_logo_transparent.png').convert('RGBA')
          src.thumbnail((660, 410), Image.Resampling.LANCZOS)
          canvas = Image.new('RGB', (1200, 630), '#FFFAF1')
          if src.getchannel('A').getbbox():
              canvas.paste(src, ((1200-src.width)//2, (630-src.height)//2), src)
          canvas.save('orka-social-preview-padded.png', optimize=True)
          html = Path('index.html')
          s = html.read_text(encoding='utf-8')
          s = s.replace('https://orkahomewear.com/orka_logo_transparent.png?v=20261113',
                        'https://orkahomewear.com/orka-social-preview-padded.png?v=20261113b')
          html.write_text(s, encoding='utf-8')
          PY
      - name: Commit preview and metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add orka-social-preview-padded.png index.html
          git diff --cached --quiet || (git commit -m "Publish centered ORKA social preview with generous margins" && git push)
