name: ORKA isolated checkout tests
on:
  push:
    branches: [orka-signature-v2]
    paths:
      - 'tests/**'
      - '.github/workflows/orka-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Firebase-free checkout tests
        run: node --test tests/*.test.mjs
