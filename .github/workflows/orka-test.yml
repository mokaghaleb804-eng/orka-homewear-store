name: ORKA isolated checkout and Firestore security tests
on:
  push:
    branches: [orka-signature-v2]
    paths:
      - 'tests/**'
      - '.github/workflows/orka-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Firebase-free checkout tests
        run: find tests -maxdepth 1 -name '*.test.mjs' ! -name '*.emulator.test.mjs' -print0 | xargs -0 node --test
  firestore-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install disposable test dependencies
        run: npm install --no-save --no-package-lock firebase@11 @firebase/rules-unit-testing@4 firebase-tools@14 firebase-admin@13
      - name: Run isolated Firestore rules emulator tests
        env:
          GCLOUD_PROJECT: demo-orka-security
        run: npx firebase emulators:exec --project demo-orka-security --only firestore --config tests/firebase.emulator.ci.json "node --test tests/firestore-rules.emulator.test.mjs tests/firestore-admin.integration.emulator.test.mjs tests/checkout-http-firestore.emulator.test.mjs"
