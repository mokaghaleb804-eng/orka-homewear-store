<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORKA — اختبار الطلب المعزول</title>
<style>*{box-sizing:border-box}body{margin:0;background:#fffaf1;color:#10294a;font-family:Arial,sans-serif;line-height:1.7}header{background:#10294a;color:white;padding:18px 6%;display:flex;justify-content:space-between;gap:12px;align-items:center}main{max-width:920px;margin:24px auto;padding:0 18px}.notice{padding:14px;background:#f8ead5;border-radius:12px}section{background:white;padding:24px;margin:18px 0;border:1px solid #e8dcc8;border-radius:16px}h1{font-size:24px;margin:0}h2{font-size:19px;margin-top:0}.row{display:flex;gap:12px;flex-wrap:wrap}label{display:block;flex:1;min-width:180px}input,select,textarea{font:inherit;width:100%;border:1px solid #c9cdd4;padding:9px;border-radius:8px}button{font:inherit;border:0;background:#244f75;color:white;padding:10px 16px;border-radius:9px;cursor:pointer}button.secondary{background:#eee;color:#10294a}button:disabled{opacity:.45;cursor:default}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}#status{padding:12px;white-space:pre-wrap;overflow-wrap:anywhere}#quote{background:#fffaf1;border-radius:10px;padding:14px}article{border-top:1px solid #e8dcc8;padding:12px 0}small{display:block}#receipt{overflow-wrap:anywhere;font-weight:bold}.hidden{display:none}@media(max-width:480px){section{padding:16px}.row{display:block}label{margin:8px 0}header{display:block}}</style>
<header><h1>ORKA HOMEWEAR</h1><span>اختبار محلي معزول</span></header><main>
<p class="notice">كل الموديلات والأسعار ورسوم الشحن هنا تجريبية. لا تُسجّل أي طلبات أو تغييرات في مشروع ORKA الحقيقي.</p>
<section><h2>اختيار جلسة الاختبار</h2><div class="actions"><button id="google">حساب Google تجريبي</button><button id="guest">الشراء كضيف تجريبي</button><button id="admin" class="secondary">دخول المدير التجريبي</button><button id="logout" class="secondary">تسجيل الخروج</button></div><p id="identity">لم تبدأ جلسة</p></section>
<section id="checkout"><h2>طلب تجريبي</h2><p>طقم تجريبي — ليس للبيع · المقاس 6 أو 8</p><form id="form"><div class="row"><label>الاسم<input id="customer" value="عميل اختبار" required></label><label>هاتف تجريبي<input id="phone" value="01012345678" required></label></div><div class="row"><label>المحافظة<select id="gov"><option>القاهرة</option><option>الجيزة</option></select></label><label>المقاس<select id="size"><option>6</option><option>8</option></select></label><label>الكمية<input id="qty" type="number" min="1" max="3" value="1" required></label></div><label>عنوان تجريبي<textarea id="address" required>عنوان وهمي للاختبار فقط</textarea></label><div class="actions"><button type="submit">مراجعة الإجمالي والشحن</button></div></form><div id="quote" class="hidden"></div><button id="confirm" disabled>أوافق على الإجمالي — تأكيد طلب تجريبي</button><p id="receipt"></p></section>
<section id="adminPanel" class="hidden"><h2>إدارة الطلبات التجريبية</h2><button id="refresh">تحديث الطلبات</button><div id="orders"></div></section>
<p id="status" role="status" aria-live="polite">جارٍ تجهيز المحاكي…</p></main><script type="module" src="/main.js"></script></html>
