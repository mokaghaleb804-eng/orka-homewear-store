<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>إدارة ORKA | دخول المسؤولين</title><style>body{font:16px/1.8 Tahoma,Arial;background:#fffaf1;color:#10294a;margin:0}.wrap{max-width:900px;margin:8vh auto;padding:24px}h1{font-size:27px}button,a{padding:12px;border-radius:8px}button{background:#10294a;color:white;border:0}#orders article{padding:14px;background:white;border:1px solid #ddd;margin:12px 0;border-radius:10px}small{display:block;color:#555}#orders{overflow-wrap:anywhere}</style></head><body><main class="wrap"><a href="/">العودة للمتجر</a><h1>ORKA ADMIN</h1><p>صفحة خاصة بالمسؤولين. الوصول للطلبات يتطلب تسجيل دخول وصلاحية مسؤول في Firebase.</p><p id="status">جارٍ التحقق من الجلسة...</p><button id="login" hidden>تسجيل الدخول بحساب Google</button><section id="orders" aria-live="polite"></section></main><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js';
import{getAuth,onAuthStateChanged,GoogleAuthProvider,signInWithPopup}from'https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js';
import{getFirestore,doc,getDoc,collection,getDocs}from'https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js';
const app=initializeApp({apiKey:"AIzaSyB3O_4JMgRni_EUWCaQzQ9dVuK4dRjJwtQ",authDomain:"orka-homewear-e63db.firebaseapp.com",projectId:"orka-homewear-e63db",appId:"1:437918635024:web:24df6283d6067e258fe695"});
const auth=getAuth(app),db=getFirestore(app),status=document.getElementById('status'),host=document.getElementById('orders'),login=document.getElementById('login');
login.onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){status.textContent='تعذر تسجيل الدخول: '+e.code}};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
onAuthStateChanged(auth,async user=>{host.replaceChildren();if(!user){status.textContent='سجّل دخولك بحساب الإدارة.';login.hidden=false;return}login.hidden=true;try{const role=await getDoc(doc(db,'admins',user.uid));if(!role.exists()||role.data().role!=='admin'){status.textContent='الحساب غير مصرح له بالإدارة.';return}status.textContent='تم التحقق من صلاحية الإدارة. جارٍ تحميل الطلبات...';const snap=await getDocs(collection(db,'orders'));status.textContent='الطلبات: '+snap.size;for(const item of snap.docs){const d=item.data(),article=document.createElement('article');article.innerHTML='<strong>طلب '+esc(item.id)+'</strong><small>الحالة: '+esc(d.status||'غير محددة')+'</small><small>المحافظة: '+esc(d.governorate||d.city||'—')+'</small><small>الإجمالي: '+esc(d.total||'—')+'</small>';host.appendChild(article)}}catch(e){status.textContent='تعذر الوصول للطلبات. راجع صلاحيات Firestore: '+e.code}});
</script></body></html>
