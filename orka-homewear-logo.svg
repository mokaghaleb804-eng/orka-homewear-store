<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-label="ORKA HOMEWEAR">
  <rect width="1000" height="300" fill="#ffffff"/>
  <style>
    .orka-letter{font-family:Georgia,'Times New Roman',serif;font-weight:bold;font-size:190px;fill:#10294A;opacity:1;transform:translateX(0);animation:orkaLetterArrive 1.1s cubic-bezier(.22,.75,.25,1) both}
    .orka-o{animation-delay:0s}.orka-r{animation-delay:1s}.orka-k{animation-delay:2s}.orka-a{animation-delay:3s}
    @keyframes orkaLetterArrive{from{opacity:0;transform:translateX(500px)}to{opacity:1;transform:translateX(0)}}
    @media(prefers-reduced-motion:reduce){.orka-letter{animation:none!important;opacity:1!important;transform:none!important}}
  </style>
  <g aria-hidden="true">
    <text class="orka-letter orka-o" x="250" y="172" text-anchor="middle">O</text>
    <text class="orka-letter orka-r" x="390" y="172" text-anchor="middle">R</text>
    <text class="orka-letter orka-k" x="530" y="172" text-anchor="middle">K</text>
    <text class="orka-letter orka-a" x="670" y="172" text-anchor="middle">A</text>
  </g>
  <text x="500" y="258" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="48" letter-spacing="18" fill="#A60F36">HOMEWEAR</text>
</svg>