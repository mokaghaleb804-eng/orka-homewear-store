<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-label="ORKA HOMEWEAR">
  <rect width="1000" height="300" fill="#ffffff"/>
  <style>
    .orka-letter{font-family:Georgia,'Times New Roman',serif;font-weight:bold;font-size:190px;fill:#10294A;opacity:0;animation:orkaLetterArrive 70s linear infinite}
    .orka-o{animation-delay:3s}.orka-r{animation-delay:2s}.orka-k{animation-delay:1s}.orka-a{animation-delay:0s}
    .orka-trail{font-family:Georgia,'Times New Roman',serif;font-weight:bold;font-size:190px;fill:#A60F36;opacity:0;animation:orkaTrailFade 70s linear infinite}
    .trail-o{animation-delay:3s}.trail-r{animation-delay:2s}.trail-k{animation-delay:1s}.trail-a{animation-delay:0s}
    @keyframes orkaLetterArrive{0%,4.2%{opacity:0;transform:translateX(500px)}5.2%{opacity:1;transform:translateX(0)}100%{opacity:1;transform:translateX(0)}}
    @keyframes orkaTrailFade{0%,4.2%{opacity:0;transform:translateX(500px)}5.2%{opacity:.2;transform:translateX(0)}7%{opacity:0;transform:translateX(0)}100%{opacity:0;transform:translateX(0)}}
    @media(prefers-reduced-motion:reduce){.orka-letter{animation:none!important;opacity:1!important;transform:none!important}.orka-trail{display:none!important}}
  </style>
  <g aria-hidden="true">
    <text class="orka-trail trail-o" x="250" y="172" text-anchor="middle">O</text>
    <text class="orka-trail trail-r" x="390" y="172" text-anchor="middle">R</text>
    <text class="orka-trail trail-k" x="530" y="172" text-anchor="middle">K</text>
    <text class="orka-trail trail-a" x="670" y="172" text-anchor="middle">A</text>
    <text class="orka-letter orka-o" x="250" y="172" text-anchor="middle">O</text>
    <text class="orka-letter orka-r" x="390" y="172" text-anchor="middle">R</text>
    <text class="orka-letter orka-k" x="530" y="172" text-anchor="middle">K</text>
    <text class="orka-letter orka-a" x="670" y="172" text-anchor="middle">A</text>
  </g>
  <text x="500" y="258" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="48" letter-spacing="18" fill="#A60F36">HOMEWEAR</text>
</svg>